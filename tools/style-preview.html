<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Taş stili önizleme v2</title>
<style>
  body { margin: 0; background: #0e141b; color: #e8eef4; font: 14px/1.35 'Segoe UI', sans-serif; padding: 12px; }
  h2 { font-size: 16px; margin: 14px 0 6px; font-weight: 600; }
  small { color: #93a4b5; }
  .board { display: grid; grid-template-columns: repeat(8, 40px); gap: 0; background: radial-gradient(ellipse at 50% 35%, #3e5568 0%, #34495e 60%, #29394a 100%); border: 4px solid #1a252f; border-radius: 8px; width: max-content; padding: 2px; }
  .board img { width: 40px; height: 40px; display: block; }
</style></head><body>
<h2>1 · Renkli madalyon <small>her tür kendi renginde disk, ince altın çerçeve, büyük beyaz sembol</small></h2><div class="board" id="b1"></div>
<h2>2 · Farklı şekil + renk <small>her türün hem rengi hem dış şekli farklı (elmas, kalp, altıgen...), büyük beyaz sembol</small></h2><div class="board" id="b2"></div>
<h2>3 · Koyu taş + parlak sembol <small>yuvarlak koyu kare, dev renkli parlayan sembol, çerçeve yok</small></h2><div class="board" id="b3"></div>
<script>
const EM = {
  sword: `<g transform="rotate(45 50 50)"><path d="M44 14 L50 3 L56 14 L56 62 L44 62 Z" fill="F" stroke="O" stroke-width="4" stroke-linejoin="round"/><rect x="29" y="60" width="42" height="10" rx="5" fill="F" stroke="O" stroke-width="4"/><rect x="45" y="70" width="10" height="16" rx="3" fill="F" stroke="O" stroke-width="4"/><circle cx="50" cy="90" r="6" fill="F" stroke="O" stroke-width="4"/></g>`,
  heart: `<path d="M50 86 C18 65 8 47 14 30 C20 14 41 12 50 27 C59 12 80 14 86 30 C92 47 82 65 50 86Z" fill="F" stroke="O" stroke-width="4.5" stroke-linejoin="round"/>`,
  shield: `<path d="M50 9 L82 21 L82 47 C82 68 67 80 50 90 C33 80 18 68 18 47 L18 21 Z" fill="F" stroke="O" stroke-width="4.5" stroke-linejoin="round"/>`,
  energy: `<path d="M61 5 L23 57 L46 57 L38 95 L78 40 L55 40 Z" fill="F" stroke="O" stroke-width="4.5" stroke-linejoin="round"/>`,
  skull: `<path d="M50 10 C28 10 14 26 14 45 C14 58 21 65 29 69 L29 85 L71 85 L71 69 C79 65 86 58 86 45 C86 26 72 10 50 10Z" fill="F" stroke="O" stroke-width="4.5" stroke-linejoin="round"/><g fill="O"><ellipse cx="36" cy="47" rx="10" ry="11"/><ellipse cx="64" cy="47" rx="10" ry="11"/><path d="M50 59 L43 70 L57 70Z"/></g>`,
  teamheal: `<path d="M38 12 H62 V38 H88 V62 H62 V88 H38 V62 H12 V38 H38 Z" fill="F" stroke="O" stroke-width="4.5" stroke-linejoin="round"/>`,
};
const COL = { sword:['#ff7a5c','#c0271c','#5a0a06'], heart:['#ff9cc0','#e0306e','#6a0a30'], shield:['#8cc4ff','#2a6fe0','#0a2a6a'], energy:['#ffe680','#f0a800','#6a4400'], skull:['#d2b0ff','#7a3fd6','#2a0c5c'], teamheal:['#8ff5b8','#1fae5a','#063a1c'] };
const em = (t, fill, outline) => EM[t].replace(/"F"/g, `"${fill}"`).replace(/"O"/g, `"${outline}"`);
const wrap = (inner, defs='') => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs>${defs}</defs>${inner}</svg>`);
function v1(t){ const [l,m,d]=COL[t]; return wrap(`<circle cx="50" cy="52" r="46" fill="#000" fill-opacity=".4"/><circle cx="50" cy="50" r="46" fill="url(#rim)"/><circle cx="50" cy="50" r="41" fill="url(#c)" stroke="${d}" stroke-width="2"/><path d="M18 40 A34 34 0 0 1 60 14 A40 34 0 0 0 18 40Z" fill="#fff" fill-opacity=".28"/><g transform="translate(50 51) scale(.66) translate(-50 -50)">${em(t,'#ffffff',d)}</g>`,
  `<radialGradient id="c" cx="40%" cy="32%" r="75%"><stop offset="0" stop-color="${l}"/><stop offset=".55" stop-color="${m}"/><stop offset="1" stop-color="${d}"/></radialGradient><linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b8"/><stop offset=".5" stop-color="#c9982f"/><stop offset="1" stop-color="#5b3a08"/></linearGradient>`); }
const SH = { sword:'M50 4 L94 50 L50 96 L6 50Z', heart:'M50 94 C12 70 2 46 12 26 C22 6 44 8 50 22 C56 8 78 6 88 26 C98 46 88 70 50 94Z', shield:'M50 3 L91 26 L91 74 L50 97 L9 74 L9 26Z', energy:'M14 6 H86 Q94 6 94 14 V86 Q94 94 86 94 H14 Q6 94 6 86 V14 Q6 6 14 6Z', skull:'M30 5 H70 L95 30 V70 L70 95 H30 L5 70 V30Z', teamheal:'M50 4 A46 46 0 1 1 49.9 4Z' };
function v2(t){ const [l,m,d]=COL[t]; return wrap(`<path d="${SH[t]}" fill="#000" fill-opacity=".4" transform="translate(0 3)"/><path d="${SH[t]}" fill="url(#c)" stroke="${d}" stroke-width="3"/><path d="${SH[t]}" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2" transform="translate(50 50) scale(.88) translate(-50 -50)"/><g transform="translate(50 51) scale(.58) translate(-50 -50)">${em(t,'#ffffff',d)}</g>`,
  `<radialGradient id="c" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="${l}"/><stop offset=".5" stop-color="${m}"/><stop offset="1" stop-color="${d}"/></radialGradient>`); }
function v3(t){ const [l,m,d]=COL[t]; return wrap(`<rect x="5" y="5" width="90" height="90" rx="18" fill="url(#bg)" stroke="#0b0f15" stroke-width="2"/><circle cx="50" cy="50" r="40" fill="url(#h)"/><g transform="translate(50 51) scale(.8) translate(-50 -50)">${em(t,'url(#e)','#0b0f15')}</g>`,
  `<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4654"/><stop offset="1" stop-color="#1c232c"/></linearGradient><radialGradient id="h"><stop offset="0" stop-color="${m}" stop-opacity=".55"/><stop offset="1" stop-color="${m}" stop-opacity="0"/></radialGradient><linearGradient id="e" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${l}"/><stop offset="1" stop-color="${m}"/></linearGradient>`); }
const types = ['sword','heart','shield','energy','skull','teamheal'];
let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
const board = Array.from({length: 48}, () => types[Math.floor(rnd() * 5.3) % 6]);
[['b1',v1],['b2',v2],['b3',v3]].forEach(([id,f]) => { const cache = {}; document.getElementById(id).innerHTML = board.map(t => `<img src="${cache[t] || (cache[t] = f(t))}">`).join(''); });
</script>
</body></html>
