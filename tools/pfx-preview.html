<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pfx preview</title>
<!-- Dev tool (effects roadmap Faz 1): the game's own arena + pfx.js playing
     the BAKED sheets (assets/fx, pixelfx-data.js) exactly as the game does -
     moves picked by id. Serve the repo root, open /tools/pfx-preview.html. -->
<style>
  body { margin: 0; background: #10161d; color: #e8eef4; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px; }
  #study-arena { position: relative; overflow: hidden; border-radius: 8px; border: 1px solid #2c3a48;
    --arena-hud-h: 42px; --portrait-h: 104px; height: calc(var(--portrait-h) * 1.3 + var(--arena-hud-h));
    background: radial-gradient(120% 90% at 50% 100%, #2a2f3a 0%, #151a22 60%, #0c1016 100%); }
  .arena-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .arena-slot { position: absolute; top: var(--arena-hud-h); bottom: 0; width: 40%; pointer-events: none; }
  .slot-left { left: 5%; } .slot-right { right: 5%; }
  button { font: inherit; color: inherit; background: #1a2430; border: 1px solid #2c3a48; border-radius: 6px; padding: 6px 10px; margin: 6px 4px 0 0; cursor: pointer; }
  #info { color: #9fb0c0; font: 12px monospace; margin-top: 8px; }
</style></head><body><main>
  <div id="study-arena">
    <canvas class="arena-canvas" id="study-arena-canvas"></canvas>
    <div class="arena-slot slot-left" id="study-hero" data-arena="study" data-side="left"></div>
    <div class="arena-slot slot-right" id="study-foe" data-arena="study" data-side="right"></div>
  </div>
  <div id="buttons"></div>
  <div id="info"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.16.0/pixi.min.js"></script>
<script>/* always the files on disk, never a cached copy (dev page) */ for (const f of ["graphics","arena","pixelfx-data","pfx","moves","avatar","catalog","items","hero"]) document.write('<script src="' + f + '.js?t=' + Date.now() + '"><\/script>');</script>
<script>
// ?cls=paladin picks the class; every move of it (and its ult) gets a button
const cls = new URLSearchParams(location.search).get('cls') || 'mage';
const hero = cgGetStage('study-hero'), foe = cgGetStage('study-foe');
hero.setAvatar(heroSpecFor(cls, null, []));
foe.setMonster('boss', 8);
if (typeof cgEffectsEnabled === 'function' && !cgEffectsEnabled()) cgToggleLowGraphics();
const bar = document.getElementById('buttons');
bar.insertAdjacentHTML('beforeend', ['warrior', 'berserker', 'rogue', 'archer', 'mage', 'necromancer', 'paladin'].map(c => `<a href="?cls=${c}" style="color:${c === cls ? '#ffe2a0' : '#9fb0c0'};margin-right:8px">${c}</a>`).join('') + '<br>');
const all = [].concat(...Object.values(CG_MOVES[cls]), CG_ULTS[cls]);
function play(m) { hero._perform(m); if (m.kind !== 'self') setTimeout(() => foe.playHit('skull', 0), cgImpactMs()); }
all.forEach(m => {
  const b = document.createElement('button');
  b.textContent = m.id + (CG_PFX_MOVES[m.id] || String(m.shot).startsWith('pfx') ? ' *' : '');
  b.onclick = () => play(m);
  bar.appendChild(b);
});
window.__preview = { hero, foe, all, play };
setInterval(() => {
  const names = Object.keys(PFX.textures);
  document.getElementById('info').textContent = 'yüklü sayfa: ' + names.length + ' / ' + Object.keys(PFX_DATA).length + (PFX.broken ? '  SHADER HATASI' : '') + '   (* = pixelfx)';
}, 500);
</script></body></html>
