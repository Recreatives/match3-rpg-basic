<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karakter stili çalışması</title>
<!-- Art-direction study (tools/make_characters_study.py). Serve the repo
     root and open /tools/character-study.html. Not part of the game. -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0e141b; --panel: #172230; --ink: #e8eef4; --muted: #93a4b5; --gold: #e8c35a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 'Segoe UI', system-ui, sans-serif; padding: 16px; }
  h1 { font-family: Cinzel, Georgia, serif; color: var(--gold); margin: 0 0 4px; font-size: 1.5rem; }
  h2 { font-family: Cinzel, Georgia, serif; font-size: 1.1rem; margin: 26px 0 8px; color: var(--gold); }
  p.lead { color: var(--muted); margin: 0 0 12px; max-width: 760px; }
  .gallery { display: grid; grid-template-columns: 110px repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 900px; align-items: center; }
  .gallery .hd { font-weight: 700; text-align: center; padding: 6px; border-radius: 8px; background: var(--panel); }
  .gallery .hd small { display: block; color: var(--muted); font-weight: 400; font-size: .78rem; }
  .gallery .rowname { font-weight: 700; color: var(--muted); }
  .cell { background: radial-gradient(ellipse at 50% 30%, #2d3e52, #16202c 70%); border-radius: 10px; aspect-ratio: 4 / 5; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .cell img { width: 100%; height: 100%; object-fit: contain; }
  .arenas { display: flex; flex-wrap: wrap; gap: 14px; }
  .arena-card { width: 360px; max-width: 100%; }
  .arena-card h3 { margin: 0 0 6px; font-size: .95rem; }
  .arena-card h3 small { color: var(--muted); font-weight: 400; }
  .arena { position: relative; height: 150px; border-radius: 10px; overflow: hidden;
           background: radial-gradient(circle at 8% 22%, rgba(255,176,72,.3), transparent 26%), radial-gradient(circle at 92% 22%, rgba(255,176,72,.3), transparent 26%),
                       radial-gradient(ellipse at 50% 118%, rgba(230,126,34,.2), transparent 64%), linear-gradient(#3a3040, #1d1822);
           box-shadow: inset 0 0 0 1px rgba(255,220,150,.14), inset 0 -24px 30px rgba(0,0,0,.35); }
  .arena-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .arena-slot { position: absolute; top: 34px; bottom: 0; width: 40%; }
  .slot-left { left: 5%; } .slot-right { right: 5%; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
  button { background: #253449; color: var(--ink); border: 1px solid #3c5170; border-radius: 8px; padding: 7px 11px; font: inherit; font-size: .88rem; cursor: pointer; }
  button:hover { background: #2f4260; }
  button.on { background: var(--gold); color: #1a1406; border-color: var(--gold); }
  .note { background: var(--panel); border-left: 3px solid var(--gold); padding: 10px 12px; border-radius: 6px; max-width: 900px; color: #cfd9e3; margin-top: 14px; }
  @media (max-width: 600px) { .gallery { grid-template-columns: 70px repeat(3, minmax(0, 1fr)); } }
</style></head><body>
<h1>Karakter stili çalışması</h1>
<p class="lead">Mevcut (chibi) çizimler ile iki epik yön yan yana. Tasarımlar aynı, yalnızca oranlar ve çizgi dili değişiyor. Altta karakterler oyunun gerçek arena motorunda, telefon genişliğinde (360 px) hareket ediyor.</p>

<h2>1 · Portreler</h2>
<div class="gallery" id="gallery"></div>

<h2>2 · Oyun boyutunda, canlı</h2>
<div class="controls" id="global-controls">
  <button data-hero="warrior" class="on">Savaşçı</button><button data-hero="mage">Büyücü</button>
  <span style="width:10px"></span>
  <button data-act="light">Hafif vuruş</button><button data-act="heavy">Ağır vuruş</button><button data-act="finisher">Bitirici</button>
  <button data-act="ult">ULT</button><button data-act="boss">Boss saldırısı</button>
  <button data-act="auto" class="on">Otomatik</button>
</div>
<div class="arenas" id="arenas"></div>

<div class="note" id="note"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.16.0/pixi.min.js"></script>
<script src="graphics.js"></script>
<script src="arena.js"></script>
<script src="moves.js"></script>
<script>
const SETS = [
  { key: 'cur', name: 'Mevcut', sub: 'chibi, kafa ≈ 1/2', dir: 'assets/characters/' },
  { key: 'epa', name: 'A · Epik gerçekçi', sub: 'kafa ≈ 1/6, ince çizgi', dir: 'tools/character-study/A/' },
  { key: 'epb', name: 'B · Epik stilize', sub: 'kafa ≈ 1/4, kalın çizgi', dir: 'tools/character-study/B/' },
];
const ROWS = [['warrior', 'Savaşçı'], ['mage', 'Büyücü'], ['monster_boss', 'Minotor (boss)']];
const g = document.getElementById('gallery');
g.innerHTML = '<div></div>' + SETS.map(s => `<div class="hd">${s.name}<small>${s.sub}</small></div>`).join('') +
  ROWS.map(([k, n]) => `<div class="rowname">${n}</div>` + SETS.map(s => `<div class="cell"><img alt="${n} ${s.name}" src="${s.dir}${k}.svg?${Date.now()}"></div>`).join('')).join('');

// minimal stand-ins for game globals the move library reads
var CLASSES = { WARRIOR: { name: 'Warrior', ultName: 'SHIELD SLAM' }, MAGE: { name: 'Mage', ultName: 'ARCANE BLAST' } };

const A = document.getElementById('arenas');
A.innerHTML = SETS.map(s => `<div class="arena-card"><h3>${s.name} <small>${s.sub}</small></h3>
  <div class="arena" id="${s.key}-arena"><canvas class="arena-canvas" id="${s.key}-arena-canvas"></canvas>
  <div class="arena-slot slot-left" id="${s.key}-hero" data-arena="${s.key}" data-side="left"></div>
  <div class="arena-slot slot-right" id="${s.key}-boss" data-arena="${s.key}" data-side="right"></div></div></div>`).join('');

let hero = 'warrior', auto = true;
function stages(s) { return [cgGetStage(s.key + '-hero'), cgGetStage(s.key + '-boss')]; }
async function load() {
  for (const s of SETS) {
    const [h, b] = stages(s);
    await h.ready; await b.ready;
    h.setPortrait(s.dir + hero + '.svg'); b.setPortrait(s.dir + 'monster_boss.svg');
    h.setGroundGlow(hero === 'mage' ? 0x3498db : 0x95a5a6);
  }
}
function act(kind) {
  SETS.forEach(s => {
    const [h, b] = stages(s);
    const pick = (list, tier) => h._pickMove('study.' + kind, list, tier);
    if (kind === 'boss') { b.playAttack(2); h.playHitReaction('skull', 480, 2); return; }
    if (kind === 'ult') { h.playUlt(hero); return; }
    const tier = kind === 'light' ? 1 : kind === 'heavy' ? 2 : 3;
    // every arena plays the SAME move so the three styles compare 1:1
    if (s === SETS[0]) window.__move = h._pickMove('study.' + kind, cgMovesFor(hero, 'sword'), tier);
    h._perform(window.__move);
    b.playHitReaction('sword', 480, tier);
  });
}
document.getElementById('global-controls').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.hero) {
    hero = b.dataset.hero;
    document.querySelectorAll('[data-hero]').forEach(x => x.classList.toggle('on', x === b));
    load();
  } else if (b.dataset.act === 'auto') {
    auto = !auto; b.classList.toggle('on', auto);
  } else act(b.dataset.act);
});
const CYCLE = ['light', 'boss', 'light', 'heavy', 'boss', 'finisher', 'ult'];
let ci = 0;
setInterval(() => { if (auto) act(CYCLE[ci++ % CYCLE.length]); }, 2300);
load();

document.getElementById('note').innerHTML = `<b>Ne karşılaştırıyoruz?</b><br>
<b>A</b> en "epik" ve karanlık fantezi hissini veren yön, ama telefonda karakter küçük görünür ve yüz detayları kaybolur.<br>
<b>B</b> aynı ciddiyeti korurken siluet ve kafa daha iri; arenada okunurluk daha iyi.<br>
Hangisinde devam edeceğimizi (ya da ikisinin arası bir oranı) seçtikten sonra 7 sınıf + 5 canavarın tamamını o stilde çizerim.`;
</script></body></html>
