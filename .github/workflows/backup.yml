name: Weekly Database Backup

# Full pg_dump of the Supabase Postgres database (every schema, including
# auth - so restoring from one of these gets everything back, not just
# game data), pushed to a SEPARATE PRIVATE repo (match3-rpg-basic-backups),
# never committed here - this repo is public, and a dump contains real
# player emails.
#
# Requires two repository secrets (Settings > Secrets and variables >
# Actions in THIS repo), neither of which should ever appear in this file
# or anywhere in chat/code - only entered directly into GitHub's own secret
# fields:
#   SUPABASE_DB_URL    the Session Pooler URI from Supabase Dashboard >
#                      Connect > Connection String, password filled in -
#                      NOT Direct Connection: Supabase's direct-connection
#                      hostname is IPv6-only, and GitHub-hosted runners have
#                      no IPv6 route, so that one fails with "Network is
#                      unreachable" here even though it works fine from a
#                      home/office network that does have IPv6
#   BACKUP_REPO_TOKEN  a GitHub Personal Access Token (fine-grained,
#                      scoped to just match3-rpg-basic-backups, Contents:
#                      Read and write) so this workflow can push there

on:
  schedule:
    - cron: '0 3 * * 0' # every Sunday, 03:00 UTC
  workflow_dispatch: {} # lets you also trigger a backup manually from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client (matches Supabase's server version)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Dump the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # Full path, not bare `pg_dump` - the runner image already has an
        # older client on PATH (whatever /usr/bin/pg_dump's
        # update-alternatives link points to), and installing 17 alongside
        # it doesn't repoint that link. Calling the versioned binary
        # directly sidesteps that instead of fighting update-alternatives.
        run: /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" -f backup.sql

      - name: Push the dump to the private backup repo
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          git clone "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/Recreatives/match3-rpg-basic-backups.git" backup-repo
          mkdir -p backup-repo/backups
          cp backup.sql "backup-repo/backups/backup_$(date +%Y%m%d).sql"
          cd backup-repo
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/
          git commit -m "Automated backup $(date +%Y-%m-%d)" || echo "Nothing changed, skipping commit"
          git push
