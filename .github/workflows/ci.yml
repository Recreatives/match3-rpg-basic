name: CI

# Runs the in-browser test suite (tests/index.html - see CLAUDE.md's Testing
# section for why it's a browser harness and not a Node test runner) on every
# push and PR, headlessly via Playwright. On a push to main specifically,
# once tests pass, also triggers a GitHub Pages rebuild - the same
# `pages/builds` API call this project has been triggering by hand after
# every merge (deployment stays "whatever branch Pages is currently
# configured to serve from," set via the repo's Pages settings or
# `gh api .../pages -X PUT` - this workflow does not change that, it only
# automates the "rebuild now" step that already exists).

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright (Chromium only)
        # `npx playwright install` alone only fetches the browser BINARY -
        # it never leaves a resolvable `playwright` package behind for the
        # later `import { chromium } from 'playwright'` step, which then
        # fails with ERR_MODULE_NOT_FOUND on a clean runner (no existing
        # node_modules/package.json here to have installed it already).
        # `npm install playwright` makes the package importable; the
        # `npx ... install --with-deps` call after it still does the actual
        # browser download.
        run: |
          npm install playwright@1
          npx playwright install --with-deps chromium

      - name: Serve the site
        run: |
          python3 -m http.server 8080 &
          sleep 2

      - name: Run tests/index.html headlessly
        run: node tests/run-ci.mjs

  # T6 (roadmap v2) - supabase/schema.sql against a real Postgres. There
  # is no staging database (see CLAUDE.md), so this is the only place a
  # schema/RPC/RLS change gets exercised before the user re-runs the file in
  # the Supabase SQL Editor. Applies a small Supabase shim, then the real
  # schema TWICE (it must be safely re-runnable), then security assertions.
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Supabase shim
        run: psql -v ON_ERROR_STOP=1 -q -f tests/sql/00_supabase_shim.sql
      - name: Apply supabase/schema.sql (1st run)
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: Apply supabase/schema.sql again (must be re-runnable)
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: RLS / RPC assertions
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/10_rls_and_rpcs.sql

  trigger-pages-rebuild:
    needs: [test, sql]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Trigger a GitHub Pages rebuild
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
