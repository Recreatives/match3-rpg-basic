<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Pixel Dungeon - Test Suite</title>
<style>
  body { font-family: monospace; background: #10161d; color: #e7ecf1; padding: 20px; }
  a { color: #7fb3ff; text-decoration: none; }
  .pass { color: #22c55e; }
  .fail { color: #ef4444; font-weight: bold; }
  #summary { font-size: 1.2rem; margin-bottom: 16px; }
  details { margin: 4px 0; }
  details > div { margin-left: 18px; }
  pre { white-space: pre-wrap; color: #fca5a5; margin: 2px 0 6px 16px; font-weight: normal; }
  small { color: #7f8c8d; font-weight: normal; }
  /* Worlds need a real, rendered viewport (layout specs measure it, PixiJS
     needs a live canvas) but shouldn't cover the report. */
  #world-host { position: fixed; left: -10000px; top: 0; }
  #world-host iframe { border: 0; display: block; }
</style>
</head>
<body>
<h1>Pixel Dungeon - Automated Test Suite</h1>
<p><small>?grep=text runs only matching tests · ?seed=N overrides the RNG seed · see tests/README.md</small></p>
<div id="summary">Running...</div>
<div id="results"></div>

<script>
// Loaded with a cache-bust so an edited spec/harness is never served stale
// by a dev server that sends no Cache-Control (python -m http.server).
// Add new spec files to this list.
(function () {
    var files = ['harness.js', 'helpers.js',
        'specs/board.spec.js', 'specs/combat.spec.js', 'specs/items.spec.js',
        'specs/contracts.spec.js', 'specs/multiplayer.spec.js',
        'specs/graphics.spec.js', 'specs/layout.spec.js'];
    var bust = Date.now().toString(36);
    files.forEach(function (f) { document.write('<script src="' + f + '?' + bust + '"><\/script>'); });
    document.write('<script>runAllTests();<\/script>');
})();
</script>
</body>
</html>
